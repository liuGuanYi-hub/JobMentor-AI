<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简历专家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #F5F7FB;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6B7BFF, #8E6BFF);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }
    .title { font-size: 15px; font-weight: 600; color: #111827; }
    .subtitle { font-size: 11px; color: #6B7280; margin-top: 2px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #E5E7EB;
      font-size: 12px;
      color: #4B5563;
      line-height: 1.6;
    }
    .card strong { color: #111827; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6B7BFF, #8E6BFF);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .status { font-size: 11px; color: #6B7280; margin-top: 8px; text-align: center; }
    .status.ok { color: #22C55E; }
    .status.err { color: #EF4444; }
    .footer { font-size: 10px; color: #9CA3AF; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">简</div>
    <div>
      <div class="title">简历专家</div>
      <div class="subtitle">JD 定制简历优化 Agent</div>
    </div>
  </div>

  <div class="card">
    <strong>使用方法：</strong><br>
    ① 在招聘网站（BOSS直聘 / 拉勾等）选中岗位 JD 文本<br>
    ② 右键 → 「发送到简历专家生成定制简历」<br>
    ③ 或双击选中后点击页面上的 ✨ 浮动按钮
  </div>

  <div class="card">
    <strong>前提：</strong>本机需已启动「简历专家」本地服务（<code>node dev-server.mjs</code>，端口 8765）。
  </div>

  <button class="btn" id="openApp">打开简历专家</button>
  <div class="status" id="status"></div>
  <div class="footer">v1.0.0 · 本地应用联动插件</div>

  <script src="popup.js"></script>
</body>
</html>
